spring:
  application:
    name: ai-engine

  config:
    import: optional:file:./application-secrets.yaml

  threads:
    virtual:
      enabled: true

  # Techo duro a la llamada al modelo. Una corrida normal tarda 70-90 s en CPU; hoy hubo una
  # patológica de 31 min que cruzó el consumer_timeout de RabbitMQ. Con esto la corrida se
  # corta, se marca como fallida y queda visible en la traza en vez de bloquear el consumidor.
  # Sobre GPU este valor debería bajar a ~60 s.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 10m

  datasource:
    url: jdbc:postgresql://localhost:5433/renaser_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        think: false
        options:
          model: gemma4:e4b
      embedding:
        options:
          model: qwen3-embedding:0.6b
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
server:
  port: 8080

supabase:
  url: https://ikyjurujfxpazygwloja.supabase.co
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
