spring:
  application:
    name: ai-engine

  config:
    import: optional:file:./application-secrets.yaml

  threads:
    virtual:
      enabled: true

  # Techo duro a la llamada al modelo. Una corrida normal tarda 70-90 s en CPU; hoy hubo una
  # patológica de 31 min que cruzó el consumer_timeout de RabbitMQ. Con esto la corrida se
  # corta, se marca como fallida y queda visible en la traza en vez de bloquear el consumidor.
  # Sobre GPU este valor debería bajar a ~60 s.
  http:
    client:
      connect-timeout: 10s
      read-timeout: 10m

  datasource:
    url: jdbc:postgresql://localhost:5433/renaser_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema. Hibernate solo comprueba que las entidades
      # coincidan con lo que las migraciones crearon: si algo no cuadra, no arranca.
      ddl-auto: validate
    show-sql: true

  # El esquema vive en src/main/resources/db/migration, versionado. Nadie toca tablas a mano.
  flyway:
    enabled: true

  # El CV pesa hasta 10 MB (regla del portal). El request completo un poco más, por el multipart.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        think: false
        options:
          model: gemma4:e4b
      embedding:
        options:
          model: qwen3-embedding:0.6b
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
        initialize-schema: true
server:
  port: 8080

supabase:
  url: https://ikyjurujfxpazygwloja.supabase.co
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

# Configuración propia del módulo de reclutamiento
app:
  archivos:
    # Dónde se guardan los CV en disco. En producción apunta a un volumen propio.
    ruta: ${ARCHIVOS_RUTA:./almacen-archivos}
  seguridad:
    # Clave HMAC para firmar los tokens. Va en application-secrets.yaml (no se versiona)
    # o por variable de entorno. Mínimo 32 bytes; sin ella la aplicación no arranca.
    jwt-secreto: ${JWT_SECRETO:}
    # Cuánto vive un token de candidato y uno del equipo (en minutos)
    minutos-token-candidato: 120
    minutos-token-equipo: 480
