<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados de la postulación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f3;
      --color-ink:     #0d0d0d;
      --color-muted:   #70706b;
      --color-accent:  #a43b36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.9rem; color: var(--color-muted);
      margin-bottom: 1.5rem; max-width: 62ch; line-height: 1.5;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Máquina de estados · Sistema de selección RENASER</p>
    <h1>El ciclo que se repite en cada etapa</h1>
    <p class="sub">Las etapas 1, 2 y 3 tienen exactamente la misma forma. Entender este ciclo una vez basta para entender los 24 estados del sistema.</p>

    <svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estados-title estados-desc">
      <title id="estados-title">Estados de la postulación</title>
      <desc id="estados-desc">Ciclo de estados que se repite en cada etapa de evaluación: el candidato trabaja, la inteligencia artificial califica, y según la nota el candidato avanza, es descartado, o queda esperando revisión humana.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#70706b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a43b36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f3"/>

      <!-- ============ LANE BANDS (drawn first, behind everything) ============ -->
      <rect x="176" y="96" width="1008" height="96" fill="rgba(13,13,13,0.018)"/>
      <rect x="176" y="288" width="1008" height="96" fill="rgba(13,13,13,0.018)"/>
      <rect x="176" y="480" width="1008" height="96" fill="rgba(13,13,13,0.018)"/>

      <line x1="176" y1="96"  x2="1184" y2="96"  stroke="rgba(13,13,13,0.12)" stroke-width="0.8"/>
      <line x1="176" y1="192" x2="1184" y2="192" stroke="rgba(13,13,13,0.12)" stroke-width="0.8"/>
      <line x1="176" y1="288" x2="1184" y2="288" stroke="rgba(13,13,13,0.12)" stroke-width="0.8"/>
      <line x1="176" y1="384" x2="1184" y2="384" stroke="rgba(13,13,13,0.12)" stroke-width="0.8"/>
      <line x1="176" y1="480" x2="1184" y2="480" stroke="rgba(13,13,13,0.12)" stroke-width="0.8"/>
      <line x1="176" y1="576" x2="1184" y2="576" stroke="rgba(13,13,13,0.12)" stroke-width="0.8"/>
      <line x1="176" y1="96"  x2="176"  y2="576" stroke="rgba(13,13,13,0.20)" stroke-width="1"/>

      <!-- lane labels -->
      <text x="56" y="140" fill="#0d0d0d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Candidato</text>
      <text x="56" y="156" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace">SIN PLAZO</text>

      <text x="56" y="236" fill="#0d0d0d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Sistema</text>
      <text x="56" y="252" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace">LA IA CALIFICA</text>

      <text x="56" y="332" fill="#0d0d0d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Reclutador</text>
      <text x="56" y="348" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace">SOLO SI HACE FALTA</text>

      <text x="56" y="428" fill="#0d0d0d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Jefe del área</text>
      <text x="56" y="444" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace">ETAPA 5 Y DECISIÓN</text>

      <text x="56" y="524" fill="#0d0d0d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Nadie</text>
      <text x="56" y="540" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace">TERMINÓ</text>

      <!-- ============ ARROWS (before boxes) ============ -->
      <!-- candidate works -> system grades : down -->
      <path d="M 360 168 L 360 216" fill="none" stroke="#70706b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="372" y="180" width="60" height="12" rx="2" fill="#f5f5f3"/>
      <text x="402" y="189" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENTREGA</text>

      <!-- system -> next stage (clear pass) : right -->
      <path d="M 456 240 L 656 240" fill="none" stroke="#70706b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="500" y="212" width="112" height="12" rx="2" fill="#f5f5f3"/>
      <text x="556" y="221" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SOBRE EL MÍNIMO</text>

      <!-- system -> reviewer (borderline) : down -->
      <path d="M 336 264 L 336 320 Q 336 328 344 328 L 400 328" fill="none" stroke="#a43b36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="348" y="332" width="80" height="12" rx="2" fill="#f5f5f3"/>
      <text x="388" y="341" fill="#a43b36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EN EL LÍMITE</text>

      <!-- system -> closed (clear fail) : down long -->
      <path d="M 264 264 L 264 512 Q 264 520 272 520 L 392 520" fill="none" stroke="#70706b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="192" y="404" width="140" height="12" rx="2" fill="#f5f5f3"/>
      <text x="262" y="413" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BAJO EL MÍNIMO</text>

      <!-- reviewer -> next stage (approves) : right then up -->
      <path d="M 600 328 L 688 328 Q 696 328 696 320 L 696 288" fill="none" stroke="#70706b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="604" y="300" width="72" height="12" rx="2" fill="#f5f5f3"/>
      <text x="640" y="309" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APRUEBA</text>

      <!-- reviewer -> closed (rejects) : down -->
      <path d="M 480 360 L 480 520" fill="none" stroke="#70706b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="492" y="428" width="72" height="12" rx="2" fill="#f5f5f3"/>
      <text x="528" y="437" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECHAZA</text>

      <!-- next stage -> the cycle repeats : short right stub -->
      <path d="M 880 240 L 944 240" fill="none" stroke="#70706b" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="892" y="212" width="48" height="12" rx="2" fill="#f5f5f3"/>
      <text x="916" y="221" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REPITE</text>

      <!-- ============ STATE BOXES ============ -->
      <!-- LANE 1 : candidate -->
      <rect x="256" y="112" width="208" height="56" rx="8" fill="#f5f5f3"/>
      <rect x="256" y="112" width="208" height="56" rx="8" fill="rgba(112,112,107,0.10)" stroke="#9a9a94" stroke-width="1"/>
      <text x="360" y="136" fill="#0d0d0d" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trabajando</text>
      <text x="360" y="154" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pendiente · en curso</text>

      <!-- LANE 2 : system grading -->
      <rect x="248" y="216" width="208" height="48" rx="8" fill="#f5f5f3"/>
      <rect x="248" y="216" width="208" height="48" rx="8" fill="rgba(13,13,13,0.05)" stroke="#70706b" stroke-width="1"/>
      <text x="352" y="238" fill="#0d0d0d" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Calificando</text>
      <text x="352" y="255" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">la IA pone nota</text>

      <!-- next stage -->
      <rect x="672" y="216" width="208" height="48" rx="8" fill="#f5f5f3"/>
      <rect x="672" y="216" width="208" height="48" rx="8" fill="#ffffff" stroke="#0d0d0d" stroke-width="1"/>
      <text x="776" y="238" fill="#0d0d0d" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Siguiente etapa</text>
      <text x="776" y="255" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vuelve a empezar</text>

      <!-- LANE 3 : reviewer -->
      <rect x="400" y="304" width="200" height="56" rx="8" fill="#f5f5f3"/>
      <rect x="400" y="304" width="200" height="56" rx="8" fill="rgba(164,59,54,0.08)" stroke="#a43b36" stroke-width="1"/>
      <text x="500" y="328" fill="#0d0d0d" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">En revisión</text>
      <text x="500" y="346" fill="#a43b36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decide una persona</text>

      <!-- LANE 5 : closed -->
      <rect x="392" y="496" width="184" height="48" rx="8" fill="#f5f5f3"/>
      <rect x="392" y="496" width="184" height="48" rx="8" fill="rgba(13,13,13,0.03)" stroke="rgba(13,13,13,0.30)" stroke-width="1"/>
      <text x="484" y="518" fill="#0d0d0d" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">No continúa</text>
      <text x="484" y="535" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">se le avisa</text>

      <!-- ============ RIGHT-SIDE NOTE — sits below the spine, clear of every arrow ============ -->
      <rect x="968" y="304" width="216" height="152" rx="6" fill="#f5f5f3"/>
      <rect x="968" y="304" width="216" height="152" rx="6" fill="#ffffff" stroke="rgba(13,13,13,0.12)" stroke-width="1"/>
      <text x="988" y="328" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SE REPITE EN</text>
      <text x="988" y="356" fill="#0d0d0d" font-size="11" font-family="'Geist', sans-serif">1 · CV</text>
      <text x="988" y="380" fill="#0d0d0d" font-size="11" font-family="'Geist', sans-serif">2 · Evaluación integral</text>
      <text x="988" y="404" fill="#0d0d0d" font-size="11" font-family="'Geist', sans-serif">3 · Prueba del puesto</text>
      <line x1="988" y1="420" x2="1164" y2="420" stroke="rgba(13,13,13,0.10)" stroke-width="0.8"/>
      <text x="988" y="438" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">Las etapas 4 y 5 siempre</text>
      <text x="988" y="452" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">las califica una persona</text>

      <!-- ============ CLOSING RULE — bottom band ============ -->
      <rect x="672" y="480" width="512" height="96" rx="6" fill="rgba(13,13,13,0.03)" stroke="rgba(13,13,13,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="696" y="508" fill="#0d0d0d" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Una postulación se cierra de cuatro formas</text>
      <text x="696" y="530" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">· el candidato la retira · el reclutador la cierra</text>
      <text x="696" y="548" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">· se cierra la convocatoria · 60 días sin avanzar</text>
      <text x="696" y="566" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">Puede pasar desde cualquier estado.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="56" y1="624" x2="1184" y2="624" stroke="rgba(13,13,13,0.10)" stroke-width="0.8"/>
      <text x="56" y="644" fill="#70706b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CÓMO LEERLO</text>

      <rect x="56" y="664" width="20" height="12" rx="3" fill="rgba(112,112,107,0.10)" stroke="#9a9a94" stroke-width="1"/>
      <text x="84" y="674" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">espera al candidato</text>

      <rect x="248" y="664" width="20" height="12" rx="3" fill="rgba(13,13,13,0.05)" stroke="#70706b" stroke-width="1"/>
      <text x="276" y="674" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">trabaja la IA</text>

      <rect x="408" y="664" width="20" height="12" rx="3" fill="rgba(164,59,54,0.08)" stroke="#a43b36" stroke-width="1"/>
      <text x="436" y="674" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">espera a una persona</text>

      <line x1="628" y1="670" x2="656" y2="670" stroke="#70706b" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="664" y="674" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">salida del proceso</text>

      <text x="828" y="674" fill="#70706b" font-size="9" font-family="'Geist Mono', monospace">Los 24 estados están en 03-ESTADOS-POSTULACION.md</text>
    </svg>
  </div>
</body>
</html>
