<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f3;
      --color-ink:     #0d0d0d;
      --color-muted:   #70706b;
      --color-accent:  #a43b36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.9rem; color: var(--color-muted);
      margin-bottom: 1.5rem; max-width: 70ch; line-height: 1.5;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Modelo de datos · Sistema de selección RENASER</p>
    <h1>El mapa de la base de datos</h1>
    <p class="sub">Setenta y una tablas agrupadas por área. No hay una tabla de candidatos: un candidato es un <strong>usuario</strong> que postuló, y sus datos personales viven en <strong>persona</strong>, la misma tabla que usa el equipo de Renaser.</p>

      </defs>
